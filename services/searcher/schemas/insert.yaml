components:
  schemas:
    InsertRequestBody:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 0
          x-usrv-cpp-type: std::uint32_t
        tokens:
          type: array
          items:
            type: integer
            minimum: 0
            x-usrv-cpp-type: std::uint32_t
          minItems: 1

    InsertResponseBody:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          default: success


